name: Dispatch Release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-release.yml"
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run Release --repo ${{ github.repository }} --ref main -f tag=v0.10.0
